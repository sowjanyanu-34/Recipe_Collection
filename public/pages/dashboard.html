<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Recipe Collection</title>
<meta name="description" content="Recipe Collection and Management System - discover, save and share recipes.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="dashboard">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="container page-pad">
  <h1 id="welcome">Dashboard</h1>
  <div id="stats" class="stats"></div>
  <div class="section-head"><h2>Browse by category</h2></div>
  <div id="cat-list" class="chips"></div>
  <div class="section-head"><h2>Recently added</h2><a class="link" href="/explore">Explore all</a></div>
  <div id="recent" class="grid"></div>
  <div class="section-head"><h2>My latest recipes</h2><a class="link" href="/my-recipes">View all mine</a></div>
  <div id="mine" class="grid"></div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">This site needs JavaScript to load recipes.</p></noscript>
<script src="/js/app.js" defer></script><script src="/js/dashboard.js" defer></script>
</body>
</html>
