<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | Recipe Collection</title>
<meta name="description" content="Recipe Collection and Management System - discover, save and share recipes.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="profile">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="container narrow page-pad">
  <h1>Your profile</h1>
  <div id="profile-stats" class="stats stats-3"></div>
  <form id="profile-form" class="panel" novalidate>
    <h2>Account details</h2>
    <ul id="form-error" class="form-error" role="alert" hidden></ul>
    <div class="row"><div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" required minlength="2" maxlength="60"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div></div>
    <h2>Change password</h2><p class="muted">Leave these blank to keep your current password.</p>
    <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password"></div>
    <div class="row"><div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password"></div></div>
    <button class="btn btn-primary" type="submit">Save changes</button>
  </form>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">This site needs JavaScript to load recipes.</p></noscript>
<script src="/js/app.js" defer></script><script src="/js/auth.js" defer></script>
</body>
</html>
