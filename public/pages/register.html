<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | Recipe Collection</title>
<meta name="description" content="Recipe Collection and Management System - discover, save and share recipes.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="auth"><div class="auth-card">
  <h1>Create your account</h1><p class="muted">Start saving and sharing recipes.</p>
  <form id="register-form" novalidate>
    <ul id="form-error" class="form-error" role="alert" hidden></ul>
    <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="60"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><small>At least 8 characters with a letter and a number.</small></div>
    <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</div></section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">This site needs JavaScript to load recipes.</p></noscript>
<script src="/js/app.js" defer></script><script src="/js/auth.js" defer></script>
</body>
</html>
